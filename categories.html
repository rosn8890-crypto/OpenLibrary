<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, minimum-scale=1.0, maximum-scale=5.0, user-scalable=yes, viewport-fit=cover">
  <meta name="theme-color" content="#0e6b57">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="OpenLibrary">
  <link rel="manifest" href="manifest.json">
  <link rel="apple-touch-icon" href="images/icon-192.png">
  <title>Browse books - OpenLibrary</title>
  <link rel="icon" href="favicon.svg" type="image/svg+xml">
  <script src="js/theme.js"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=DM+Sans:opsz,wght@9..40,400..700&family=Fraunces:opsz,wght@9..144,400..700&family=Literata:opsz,wght@7..72,400..700&display=swap">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <header id="navbar" class="navbar"></header>
  <main class="container">
    <div class="page-head">
      <h1>Browse the library</h1>
      <p id="resultCount">Loading...</p>
    </div>

    <div class="toolbar">
      <form id="searchForm" class="search-box">
        <input id="searchInput" type="search" placeholder="Search by title or author" aria-label="Search books">
        <button class="btn" type="submit">Search</button>
      </form>
      <select id="sortSelect" aria-label="Sort books">
        <option value="new">Newest first</option>
        <option value="old">Oldest first</option>
        <option value="title">Title A to Z</option>
        <option value="author">Author A to Z</option>
      </select>
    </div>

    <div class="chips" id="chips"></div>
    <div class="grid" id="bookGrid"></div>
  </main>
  <footer id="footer" class="footer"></footer>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="js/config.js"></script>
  <script src="js/common.js"></script>
  <script src="js/pwa.js"></script>
  <script src="js/categories.js"></script>
</body>
</html>
