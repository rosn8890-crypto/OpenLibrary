<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
  <meta name="theme-color" content="#0e6b57">
  <title>Reading - OpenLibrary</title>
  <link rel="icon" href="favicon.svg" type="image/svg+xml">
  <script src="js/theme.js"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=DM+Sans:opsz,wght@9..40,400..700&family=Fraunces:opsz,wght@9..144,400..700&display=swap">
  <link rel="stylesheet" href="css/style.css">
</head>
<body class="reader-body theme-dark" id="readerBody">
  <div class="reader-bar" id="readerBar">
    <a href="index.html" id="backLink" aria-label="Back to the book page">Back</a>
    <div class="reader-title" id="readerTitle">Loading...</div>
    <div class="reader-tools">
      <button id="zoomDown" aria-label="Zoom out" title="Zoom out (pinch, Ctrl + scroll, or click)">−</button>
      <button id="zoomUp" aria-label="Zoom in" title="Zoom in (pinch, Ctrl + scroll, or click)">+</button>
      <span class="gap"></span>
      <button data-theme="dark" aria-label="Dark mode">Dark</button>
      <button data-theme="sepia" aria-label="Sepia mode">Sepia</button>
      <button data-theme="light" aria-label="Light mode">Light</button>
      <span class="gap"></span>
      <button id="focusBtn" aria-label="Toggle focus mode">Focus</button>
    </div>
  </div>
  <div class="reader-progress" id="readerProgress"><span id="progressFill"></span></div>

  <main class="reader-main" id="readerMain">
    <div class="reader-stage" id="readerStage">
      <!-- Left / right invisible zones: tap or click to turn pages. The middle toggles focus mode. -->
      <button class="tap-zone tap-left" id="tapPrev" aria-label="Previous page"></button>
      <button class="tap-zone tap-mid" id="tapFocus" aria-label="Toggle focus mode"></button>
      <button class="tap-zone tap-right" id="tapNext" aria-label="Next page"></button>

      <div class="page-frame" id="pageFrame"></div>

      <div class="stage-spinner" id="stageSpinner" hidden><span class="spinner"></span><p>Loading page...</p></div>
      <div class="stage-error" id="stageError" hidden>
        <p id="stageErrorText">Something went wrong.</p>
        <button class="btn" id="retryBtn">Retry</button>
      </div>
    </div>

    <div class="reader-notice" id="notice" hidden></div>
    <div class="swipe-hint" id="swipeHint" hidden>Swipe, tap the sides, or use the arrow keys to turn pages</div>
  </main>

  <div class="reader-foot" id="readerFoot">
    <button id="prevBtn" disabled aria-label="Previous page">‹ Prev</button>
    <span id="pageInfo">Page 1</span>
    <button id="nextBtn" disabled aria-label="Next page">Next ›</button>
    <span id="saveState"></span>
  </div>

  <!-- PDF.js renders every book (all books on OpenLibrary are PDF, in full HD) -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="js/config.js"></script>
  <script src="js/common.js"></script>
  <script src="js/reader.js"></script>
</body>
</html>
